# Repository-specific configuration. The factory core does not contain these assumptions.
schema_version = 1

[project]
name = "Software (re)-Factory Workshop"
default_branch = "main"
source_roots = ["demo-app", "factory", "workshop-guide"]
protected_paths = [".github/workflows", "factory/planning_schemas", "factory/policy.json", "factory/roles.json"]

[environment]
required_tools = ["git", "python3", "node"]
setup = ["{python} -m pip install -r demo-app/requirements.txt", "cd workshop-guide && npm install"]
ports = [5000]

[qa]
test_roots = ["demo-app/tests", "demo-app/static/tests"]
test_file_patterns = ["test_ticket_{ticket}*.py", "ticket-{ticket}*.test.js"]

[[gate]]
name = "api-tests"
cmd = "{python} -m pytest -q demo-app/tests"
required = true
level = "full"

[[gate]]
name = "ui-logic-tests"
cmd = "node --test demo-app/static/tests/*.test.js"
required = true
level = "full"

[[gate]]
name = "python-compile"
cmd = "{python} -m compileall -q factory demo-app"
required = false
level = "fast"

[[gate]]
name = "deep-integrity"
cmd = "git diff --check"
required = true
level = "deep"

[reset]
command = ["./factory/setup_demo.sh", "--scenario", "{scenario}"]
start_over_flag = "--start-over"
