# Human-owned policy for the Software (re)-Factory.
# Agents may read this file but must never modify it.
schema_version = 1
approved = true
approved_policy_sha256 = "48caea15915d7f24a62b57670b4bd43b1d3abce122a5908bd9b317ade01156ba"

[policy]
consequence_tier = "shared"
merge_authority = "human"
existing_tests = "review"
planning_approvals = ["product_review", "alignment"]
gate_level = "full"
stop_conditions = ["A required gate is missing, skipped, or fails.", "A proposed change touches a never-modify path.", "The human review queue reaches its configured capacity.", "The requested work exceeds the approved Ticket or diff budget.", "The Charter is silent about a load-bearing change."]

[limits]
max_retries = 2
max_diff_lines = 800
max_awaiting_human_review = 3
max_blocked_for_human = 2
oldest_review_hours = 24

[paths]
load_bearing = ["factory.charter.toml", "factory.project.toml", ".github/workflows", "migrations", "auth", "security", "factory/planning_schemas", "factory/policy.json", "factory/roles.json"]
editable = ["demo-app", "factory", "workshop-guide"]
never_modify = ["factory.charter.toml", ".env", ".secrets"]
requires_human_approval = ["factory.project.toml", "AGENTS.md", "CLAUDE.md", ".agents", ".codex", ".github/workflows", "migrations", "auth", "security", "demo-app/tests", "demo-app/static/tests", "factory/planning_schemas", "factory/policy.json", "factory/roles.json"]
