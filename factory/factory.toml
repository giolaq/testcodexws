[factory]
max_retries = 2
poll_interval = 20
agent_timeout = 900
gate_timeout = 300

[agents]
claude = 'claude -p "$(cat {prompt})" --permission-mode acceptEdits'
codex = '{codex} exec --sandbox workspace-write --ephemeral "$(cat {prompt})"'
cursor = 'cursor-agent -p "$(cat {prompt})"'
mock = '{python} factory/mock_agent.py {ticket} --scenario {scenario}'
mock-qa = '{python} factory/mock_qa_agent.py {ticket} --scenario {scenario}'

[qa]
agent = "codex"
max_retries = 1
require_human_approval = false
test_roots = ["demo-app/tests", "demo-app/static/tests"]

[[gate]]
name = "api-tests"
cmd = '{python} -m pytest -q demo-app/tests'
required = true

[[gate]]
name = "ui-logic-tests"
cmd = 'node --test demo-app/static/tests/*.test.js'
required = true

[[gate]]
name = "python-compile"
cmd = '{python} -m compileall -q factory demo-app'
required = false
